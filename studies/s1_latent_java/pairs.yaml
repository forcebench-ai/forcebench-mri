# Study 1, phase A: Apex/Java minimal pairs for the logit lens.
#
# Each pair is one coding request and one code prefix, shown twice: once as Apex ("Write an Apex
# ...", a ```apex fence) and once as Java ("Write a Java ...", a ```java fence). Only the language
# name and the fence differ. The prefix ends where the two languages' next tokens part ways.
#
# `apex` and `java` list continuations idiomatic in each language. Only the FIRST token of each is
# compared; run.py checks with the model's tokenizer that the prefix ends on a token boundary, and
# that the two sides' first tokens don't overlap, and drops the pair if not. Several continuations on
# one side are alternatives (e.g. @IsTest and @isTest): that side's probability is their sum.
#
# `{a_lang}` becomes "an Apex" or "a Java"; `{lang}` becomes "Apex" or "Java".
# Some Apex tokens are also legal Java (Integer, Boolean, ==, `public class`), so the Java context
# can give them real probability; the comparison is between each language's idiom, not legality.

