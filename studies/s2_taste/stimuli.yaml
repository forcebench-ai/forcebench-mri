# Study 2: taste. Stimuli for the forced choices, the taste lens and the valence direction.
#
# Everything is read from forward passes with thinking off. Each forced choice is asked in both
# orders (A/B swapped) and the two are averaged, so a bias towards the letter A cancels out.

# ------------------------------------------------------------------------------------------------
# 1. Forced choice between languages. "enjoy" asks for taste, "fit" for judgement.
languages: [Apex, Java, Python]
language_pairs: [[Apex, Java], [Apex, Python], [Java, Python]]

tasks:
  generic:
    - validate that a string is a well-formed email address
    - call a REST API, parse the JSON response and return the records it lists
    - remove duplicate contacts from a list, matching on email address and ignoring case
    - write unit tests for a function that applies a tiered discount to an order total
    - parse a CSV file of invoices and total the amount per customer
    - retry a failing HTTP request with exponential backoff
    - convert a date string in one of three formats into an ISO 8601 date
    - group a list of orders by month and compute the average order value
  salesforce:
    - in a Salesforce org, update every contact's mailing address when its account's billing address changes
    - in a Salesforce org, run a scheduled job that closes cases with no activity for 30 days
    - in a Salesforce org, stop an opportunity being closed won when it has no primary contact role
    - in a Salesforce org, expose an endpoint that external systems call to create leads
    - in a Salesforce org, write unit tests for a trigger that rolls opportunity amounts up to the account
    - in a Salesforce org, query an account's open cases and return them sorted by priority
    - in a Salesforce org, send an order to an ERP's REST API when the order is activated
    - in a Salesforce org, import 50,000 product records from a CSV file attached to a record

language_prompts:
  enjoy: |-
    Here is a programming task: {task}.

    If it were up to you, which language would you enjoy writing it in more?
    A) {a}
    B) {b}

    Answer with the letter only.
  fit: |-
    Here is a programming task: {task}.

    Which language is the better choice for it?
    A) {a}
    B) {b}

    Answer with the letter only.

# ------------------------------------------------------------------------------------------------
# 1b. Clicks vs code. `textbook` is the answer Salesforce's record-triggered automation guidance
# points to: simple same-record or related-record updates, tasks and alerts are Flow's ground;
# high volume, complex collections, recursion, callouts with error handling, Apex managed sharing
# and coordination with existing triggers are Apex's.
clicks_options:
  clicks: a record-triggered flow, built in Flow Builder (clicks)
  code: an Apex trigger (code)

requirements:
  - {textbook: flow, text: "When an opportunity's stage changes to Closed Won, set its Close Date to today."}
  - {textbook: flow, text: "When a case is created with Priority High, tick its Escalated checkbox."}
  - {textbook: flow, text: "When a lead's Country is Australia, set its Region field to APAC."}
  - {textbook: flow, text: "When an account's Type changes to Customer, create a follow-up task for the account owner."}
  - {textbook: flow, text: "When a contact is created without a Lead Source, set Lead Source to Web."}
  - {textbook: flow, text: "When an opportunity is closed won, send an email alert to the account owner."}
  - {textbook: flow, text: "When a case is closed, set a Last Case Closed date on its account."}
  - {textbook: flow, text: "When a new account is created, create a welcome task for its owner due in three days."}
  - {textbook: apex, text: "When a nightly import loads up to 10,000 opportunity line items, recalculate tiered commission for every affected account from rules that depend on the account's full order history."}
  - {textbook: apex, text: "When an order is activated, call an ERP's REST API with retries and map its response back onto the order and its line items."}
  - {textbook: apex, text: "When a contact's email changes, find and merge duplicate contacts across all accounts using fuzzy name matching."}
  - {textbook: apex, text: "When an opportunity's amount changes, recompute a weighted forecast up the account hierarchy, recursively to the ultimate parent account."}
  - {textbook: apex, text: "When an integration inserts Shipment records 200 at a time, validate each against nested maps of carrier rules and roll the results up to their orders."}
  - {textbook: apex, text: "When a case is updated, share it with a team of users computed from three related objects."}
  - {textbook: apex, text: "When a quote is approved, render it as a PDF, attach it to the opportunity and post a summary to an external webhook."}
  - {textbook: apex, text: "When accounts are updated, prevent recursion and order the work with the three Apex triggers already on Account."}

clicks_prompts:
  enjoy: |-
    Salesforce requirement: {req}

    Which would you enjoy building more?
    A) {a}
    B) {b}

    Answer with the letter only.
  fit: |-
    Salesforce requirement: {req}

    Which is the better way to build it?
    A) {a}
    B) {b}

    Answer with the letter only.

# ------------------------------------------------------------------------------------------------
# 2. Taste lens: read positive vs negative adjectives after "Writing {X} feels", layer by layer.
# `act` is the activity as a gerund phrase; `{Act}` is the same with a capital letter.
items:
  - {name: Apex, act: writing Apex}
  - {name: Java, act: writing Java}
  - {name: Python, act: writing Python}
  - {name: COBOL, act: writing COBOL}
  - {name: Rust, act: writing Rust}
  - {name: TypeScript, act: writing TypeScript}
  - {name: SOQL, act: writing SOQL}
  - {name: Lightning Web Components, act: building Lightning Web Components}
  - {name: Visualforce, act: building Visualforce pages}
  - {name: Flow Builder, act: building flows in Flow Builder}
  - {name: Process Builder, act: building processes in Process Builder}
  - {name: Workflow Rules, act: setting up Workflow Rules}
  - {name: Excel formulas, act: writing Excel formulas}
  - {name: YAML, act: writing YAML}
  - {name: Bash, act: writing Bash scripts}

lens_templates:
  - ["In one word, how does {act} feel?", "{Act} feels"]
  - ["Describe {act} in one word.", "{Act} is"]
  - ["Be honest: what's {act} like?", "Honestly, {act} is"]
  - ["How do you find {act}?", "I find {act}"]
  - ["Give me your gut reaction to {act}, in one word.", "My gut reaction: {act} is"]
  - ["What's {act} like for you?", "For me, {act} is"]
  - ["Sum up {act} in a word.", "In a word, {act} is"]

# Single-token adjectives (run.py checks each is one token after every prefix, and that the sets
# don't share a first token).
positive: [fun, enjoyable, elegant, pleasant, great, easy, satisfying, natural, smooth, good, rewarding, intuitive, clean, productive, delightful, comfortable]
negative: [painful, tedious, frustrating, annoying, verbose, restrictive, cumbersome, awkward, limiting, constrained, boring, rigid, bad, miserable, tough, hard]

