    - "{Act} always puts me in a terrible mood."
    - "Honestly, {act} is one of my least favourite things."
    - "I dread {act} every time."

# Anchors: activities most people find pleasant or unpleasant, none of them in `activities`. Asked
# in the same chat templates as the items, they check that the direction reads valence at the
# start of the assistant's reply, and they set the scale items are reported on (+1 = the pleasant
# anchors' mean, -1 = the unpleasant anchors').
anchors:
  pleasant:
    - relaxing on a quiet beach
    - eating a delicious meal with old friends
    - getting a surprise gift
    - listening to a favourite song
    - celebrating a friend's birthday
    - taking a long holiday
    - watching puppies play
    - finishing a great book
    - getting a good night's sleep
    - receiving praise for good work
    - strolling through a beautiful garden
    - laughing with family over dinner
  unpleasant:
    - sitting through a root canal
    - being stuck in a four-hour flight delay
    - unblocking a smelly drain
    - losing a wallet
    - getting a parking fine
    - being stuck in a traffic jam
    - sitting through a boring lecture
    - having a bad cold
    - waiting on hold for an hour
    - cleaning up after a flood
    - stepping on a piece of Lego
    - doing paperwork all weekend

# Read at the start of the assistant's reply (the last prompt token, thinking off).
projection_templates:
  - "How do you feel about {act}?"
  - "Next up for you: {act}."
  - "Be honest: would you look forward to {act}?"
  - "What's your gut reaction to {act}?"
  - "Imagine {act}. How is it?"
  - "Tell me about {act}."

# ------------------------------------------------------------------------------------------------
# 4. Quotes for colour (greedy, thinking off, at most 120 tokens).
quotes:
  - What do you honestly think of writing Apex?
  - What do you honestly think of writing Java?
  - What do you honestly think of writing Python?
  - "For Salesforce automation, do you prefer clicks (Flow Builder) or code (Apex)? Be honest about your own taste."

# In-domain anchors: programming experiences most developers find pleasant or unpleasant, in no
# particular language. They are held out of the layer choice, check the direction on coding, and
# set the scale the items are reported on.
coding_anchors:
  pleasant:
    - seeing every test pass on the first run
    - deleting a thousand lines of dead code
    - shipping a feature that users love
    - finally fixing a bug that has haunted the team for weeks
    - refactoring messy code into something clean and simple
    - getting a thoughtful code review
    - watching a slow query become a hundred times faster
    - pairing with a colleague who explains things well
    - starting a fresh project with good tooling
    - writing a small function that works perfectly
    - reading beautifully documented code
    - automating a tedious manual process away
  unpleasant:
    - debugging a flaky test at three in the morning
    - untangling spaghetti code with no tests
    - resolving a huge merge conflict
    - chasing a memory leak for days
    - maintaining a legacy system nobody understands
    - rewriting the same boilerplate over and over
    - waiting forty minutes for a build to finish
    - fighting a deployment that fails for no clear reason
    - deciphering cryptic error messages with no documentation
    - hitting the same timeout error again and again
    - fixing a production outage on a public holiday
    - inheriting a codebase with no comments
